<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سایت من</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #d1d5db;
            line-height: 1.8;
        }

        button {
            margin-top: 20px;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>سلام 👋</h1>

        <p>
            به سایت من خوش اومدی!
            <br>
            این اولین سایت منه که ساختم.
        </p>

        <button onclick="alert('هه خوش اومدی جیگر😎')">
            کلیک کن
        </button>
    </div>

</body>
</html>
